<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Peta OpenStreetMap</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0F172A;
            color: #F8FAFC;
            padding: 20px;
            line-height: 1.6;
            margin: 0;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h1 {
            color: #4F46E5;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        
        #map {
            width: 100%;
            height: 600px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .controls {
            background-color: rgba(30, 41, 59, 0.7);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        
        button {
            background: linear-gradient(135deg, #4F46E5, #EC4899);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        
        button:hover {
            opacity: 0.9;
        }
        
        .status {
            background-color: rgba(30, 41, 59, 0.7);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid #334155;
        }
        
        pre {
            background-color: #1E293B;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            color: #F8FAFC;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Peta OpenStreetMap</h1>
        
        <div class="controls">
            <button id="initMapBtn">Inisialisasi Peta</button>
            <button id="resizeMapBtn">Resize Peta</button>
            <button id="addMarkerBtn">Tambah Marker</button>
            <button id="clearMapBtn">Hapus Peta</button>
        </div>
        
        <div id="map"></div>
        
        <div class="status">
            <h3>Status:</h3>
            <pre id="status">Belum ada aktivitas</pre>
        </div>
    </div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // Status logging function
        function log(message) {
            const statusEl = document.getElementById('status');
            const timestamp = new Date().toLocaleTimeString();
            statusEl.textContent = `[${timestamp}] ${message}\n` + statusEl.textContent;
            console.log(message);
        }
        
        // Global map variable
        let map = null;
        
        // Initialize map
        document.getElementById('initMapBtn').addEventListener('click', function() {
            try {
                // Clear existing map if any
                if (map) {
                    map.remove();
                    map = null;
                }
                
                const mapContainer = document.getElementById('map');
                mapContainer.innerHTML = '';
                
                log('Initializing map...');
                
                // Create map
                map = L.map('map', {
                    center: [-2.5489, 118.0149], // Center of Indonesia
                    zoom: 5
                });
                
                // Add OpenStreetMap tile layer
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                    maxZoom: 19
                }).addTo(map);
                
                log('Map initialized successfully');
            } catch (error) {
                log(`Error initializing map: ${error.message}`);
            }
        });
        
        // Resize map
        document.getElementById('resizeMapBtn').addEventListener('click', function() {
            if (!map) {
                log('Map not initialized yet');
                return;
            }
            
            try {
                log('Resizing map...');
                map.invalidateSize(true);
                log('Map resized successfully');
            } catch (error) {
                log(`Error resizing map: ${error.message}`);
            }
        });
        
        // Add marker
        document.getElementById('addMarkerBtn').addEventListener('click', function() {
            if (!map) {
                log('Map not initialized yet');
                return;
            }
            
            try {
                log('Adding marker...');
                L.marker([-6.2088, 106.8456]) // Jakarta
                    .addTo(map)
                    .bindPopup('Jakarta')
                    .openPopup();
                log('Marker added successfully');
            } catch (error) {
                log(`Error adding marker: ${error.message}`);
            }
        });
        
        // Clear map
        document.getElementById('clearMapBtn').addEventListener('click', function() {
            if (!map) {
                log('Map not initialized yet');
                return;
            }
            
            try {
                log('Clearing map...');
                map.remove();
                map = null;
                document.getElementById('map').innerHTML = '';
                log('Map cleared successfully');
            } catch (error) {
                log(`Error clearing map: ${error.message}`);
            }
        });
        
        // Log initial status
        log('Page loaded. Click "Inisialisasi Peta" to start.');
    </script>
</body>
</html>
